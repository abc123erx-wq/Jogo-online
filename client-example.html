<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Online - WebSocket Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .status-box {
            background: #f5f5f5;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            font-size: 14px;
        }
        
        .status-label {
            color: #666;
            font-weight: 500;
        }
        
        .status-value {
            color: #333;
            font-weight: bold;
        }
        
        .status-connected {
            color: #27ae60;
        }
        
        .status-disconnected {
            color: #e74c3c;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-secondary {
            background: #e74c3c;
            color: white;
        }
        
        .btn-secondary:hover:not(:disabled) {
            background: #c0392b;
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .messages-container {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            height: 300px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 13px;
            font-family: monospace;
        }
        
        .message {
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 3px;
            word-break: break-all;
        }
        
        .message-sent {
            background: #e3f2fd;
            border-left: 3px solid #2196f3;
            color: #1565c0;
        }
        
        .message-received {
            background: #e8f5e9;
            border-left: 3px solid #4caf50;
            color: #2e7d32;
        }
        
        .message-system {
            background: #fff3e0;
            border-left: 3px solid #ff9800;
            color: #e65100;
            font-weight: 500;
        }
        
        .message-error {
            background: #ffebee;
            border-left: 3px solid #f44336;
            color: #c62828;
        }
        
        .timestamp {
            font-size: 12px;
            opacity: 0.7;
        }
        
        .quick-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        .quick-buttons button {
            padding: 8px;
            font-size: 12px;
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }
        
        .quick-buttons button:hover:not(:disabled) {
            background: #e0e0e0;
        }
        
        .info-box {
            background: #e3f2fd;
            border: 1px solid #90caf9;
            border-radius: 5px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 13px;
            color: #1565c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Jogo Online</h1>
        <p class="subtitle">WebSocket Client - Teste a Conexão</p>
        
        <div class="status-box">
            <div class="status-item">
                <span class="status-label">Status:</span>
                <span class="status-value" id="statusValue">
                    <span class="status-disconnected">● Desconectado</span>
                </span>
            </div>
            <div class="status-item">
                <span class="status-label">Clientes Conectados:</span>
                <span class="status-value" id="clientCount">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">ID do Cliente:</span>
                <span class="status-value" id="clientId">-</span>
            </div>
        </div>
        
        <div class="info-box">
            💡 <strong>URL do Servidor:</strong> <code id="serverUrl">ws://localhost:3000</code>
        </div>
        
        <div class="form-group">
            <label for="serverInput">URL do Servidor:</label>
            <input type="text" id="serverInput" value="ws://localhost:3000" placeholder="ws://seu-servidor.railway.app">
        </div>
        
        <div class="button-group">
            <button class="btn-primary" id="connectBtn" onclick="connect()">Conectar</button>
            <button class="btn-secondary" id="disconnectBtn" onclick="disconnect()" disabled>Desconectar</button>
        </div>
        
        <div class="form-group">
            <label for="messageType">Tipo de Mensagem:</label>
            <select id="messageType">
                <option value="playerMove">Movimento do Jogador</option>
                <option value="playerAttack">Ataque</option>
                <option value="playerChat">Chat</option>
                <option value="custom">Customizado</option>
            </select>
        </div>
        
        <div class="form-group" id="customDataGroup" style="display: none;">
            <label for="messageData">Dados (JSON):</label>
            <textarea id="messageData" rows="3" placeholder='{"x": 100, "y": 200}'></textarea>
        </div>
        
        <div class="form-group" id="chatMessageGroup" style="display: none;">
            <label for="chatMessage">Mensagem:</label>
            <input type="text" id="chatMessage" placeholder="Digite sua mensagem...">
        </div>
        
        <div class="quick-buttons">
            <button onclick="sendQuickMessage('playerMove', {x: 100, y: 200, direction: 'right'})">🎮 Mover Direita</button>
            <button onclick="sendQuickMessage('playerMove', {x: 100, y: 150, direction: 'up'})">⬆️ Mover Cima</button>
            <button onclick="sendQuickMessage('playerAttack', {target: 'enemy', damage: 25})">⚔️ Atacar</button>
            <button onclick="clearMessages()">🗑️ Limpar</button>
        </div>
        
        <div class="button-group">
            <button class="btn-primary" onclick="sendMessage()" id="sendBtn" disabled>Enviar Mensagem</button>
        </div>
        
        <label>Mensagens:</label>
        <div class="messages-container" id="messagesContainer"></div>
    </div>

    <script>
        let ws = null;
        let clientId = null;

        // Update UI based on message type selection
        document.getElementById('messageType').addEventListener('change', function() {
            const customGroup = document.getElementById('customDataGroup');
            const chatGroup = document.getElementById('chatMessageGroup');
            
            customGroup.style.display = this.value === 'custom' ? 'block' : 'none';
            chatGroup.style.display = this.value === 'playerChat' ? 'block' : 'none';
        });

        function connect() {
            const serverUrl = document.getElementById('serverInput').value;
            
            if (!serverUrl) {
                addMessage('Insira a URL do servidor', 'error');
                return;
            }

            try {
                ws = new WebSocket(serverUrl);

                ws.onopen = () => {
                    addMessage('✅ Conectado ao servidor', 'system');
                    updateStatus();
                };

                ws.onmessage = (event) => {
                    const message = JSON.parse(event.data);
                    
                    if (message.type === 'welcome') {
                        clientId = message.clientId;
                        addMessage(`Bem-vindo! ID: ${message.clientId}`, 'system');
                    } else if (message.type === 'userCount') {
                        document.getElementById('clientCount').textContent = message.count;
                    } else {
                        addMessage(JSON.stringify(message), 'received');
                    }
                    
                    updateStatus();
                };

                ws.onerror = (error) => {
                    addMessage(`❌ Erro: ${error.message || 'Erro desconhecido'}`, 'error');
                };

                ws.onclose = () => {
                    addMessage('❌ Desconectado do servidor', 'system');
                    clientId = null;
                    updateStatus();
                };
            } catch (error) {
                addMessage(`Erro ao conectar: ${error.message}`, 'error');
            }
        }

        function disconnect() {
            if (ws) {
                ws.close();
                addMessage('Desconectando...', 'system');
            }
        }

        function sendMessage() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('❌ Não conectado ao servidor', 'error');
                return;
            }

            const messageType = document.getElementById('messageType').value;
            let message = {};

            if (messageType === 'custom') {
                try {
                    message = {
                        type: 'custom',
                        data: JSON.parse(document.getElementById('messageData').value)
                    };
                } catch (error) {
                    addMessage('❌ JSON inválido no campo de dados', 'error');
                    return;
                }
            } else if (messageType === 'playerChat') {
                message = {
                    type: 'playerChat',
                    data: { text: document.getElementById('chatMessage').value }
                };
                document.getElementById('chatMessage').value = '';
            } else {
                message = {
                    type: messageType,
                    data: {}
                };
            }

            try {
                ws.send(JSON.stringify(message));
                addMessage(JSON.stringify(message), 'sent');
            } catch (error) {
                addMessage(`❌ Erro ao enviar: ${error.message}`, 'error');
            }
        }

        function sendQuickMessage(type, data) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                addMessage('❌ Não conectado ao servidor', 'error');
                return;
            }

            const message = { type, data };
            ws.send(JSON.stringify(message));
            addMessage(JSON.stringify(message), 'sent');
        }

        function addMessage(text, type = 'received') {
            const container = document.getElementById('messagesContainer');
            const div = document.createElement('div');
            const now = new Date().toLocaleTimeString();
            
            div.className = `message message-${type}`;
            div.innerHTML = `<span class="timestamp">${now}</span><br>${text}`;
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function clearMessages() {
            document.getElementById('messagesContainer').innerHTML = '';
        }

        function updateStatus() {
            const statusValue = document.getElementById('statusValue');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const sendBtn = document.getElementById('sendBtn');
            const clientIdEl = document.getElementById('clientId');

            if (ws && ws.readyState === WebSocket.OPEN) {
                statusValue.innerHTML = '<span class="status-connected">● Conectado</span>';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                sendBtn.disabled = false;
                clientIdEl.textContent = clientId || '-';
            } else {
                statusValue.innerHTML = '<span class="status-disconnected">● Desconectado</span>';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                sendBtn.disabled = true;
                clientIdEl.textContent = '-';
                document.getElementById('clientCount').textContent = '0';
            }
        }

        // Enter key to send message
        document.getElementById('messageData').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) sendMessage();
        });

        document.getElementById('chatMessage').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        updateStatus();
    </script>
</body>
</html>
